<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1C1D20" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#0C0D0E"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- frame + corner ticks -->
  <rect x="32.5" y="32.5" width="1215" height="575" stroke="#2A2B2F"/>
  <path d="M32 48V32H48M1232 32H1248V48M1248 592V608H1232M48 608H32V592" stroke="#FF5A1F" stroke-width="2"/>

  <!-- mark (32-grid x6) -->
  <g transform="translate(96 160) scale(6)">
    <rect width="32" height="32" rx="6" fill="#17181A" stroke="#2A2B2F" stroke-width="0.17"/>
    <path d="M4 8H9V10H4ZM4 15H9V17H4ZM4 22H9V24H4Z" fill="#EDEDEA"/>
    <path fill-rule="evenodd" d="M9 5H22L25 8V12L24 14L27 17V24L24 27H9ZM14 8V12H21V8ZM14 16V24H23V16Z" fill="#FF5A1F"/>
    <path d="M10.5 8H12.5V10H10.5ZM10.5 15H12.5V17H10.5ZM10.5 22H12.5V24H10.5Z" fill="#17181A"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="430" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="88" font-weight="700" letter-spacing="6" fill="#EDEDEA">BUSBAR</text>
  <text x="100" y="482" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="28" letter-spacing="1" fill="#9A9DA3">291 Providers <tspan fill="#FF5A1F">-&gt;</tspan> 1 Endpoint</text>
  <text x="100" y="552" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2" fill="#686B71">$ npx busbar   //   LOCAL LLM GATEWAY   //   :20128/v1</text>

  <!-- schematic: N feeders -> copper busbar -> 1 output feeder -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1">
    <text x="704" y="128" fill="#686B71">FEED[0..290]</text>
    <!-- feeder lines -->
    <g stroke="#3A3B40" stroke-width="2">
      <path d="M720 160H896M720 192H896M720 224H896M720 256H896M720 320H896M720 352H896M720 384H896M720 416H896"/>
    </g>
    <path d="M720 288H896" stroke="#EDEDEA" stroke-width="2"/>
    <!-- source terminals (circle = generator) -->
    <g stroke="#EDEDEA" stroke-width="2" fill="#0C0D0E">
      <circle cx="712" cy="160" r="6"/><circle cx="712" cy="192" r="6"/><circle cx="712" cy="224" r="6"/>
      <circle cx="712" cy="256" r="6"/><circle cx="712" cy="288" r="6"/><circle cx="712" cy="320" r="6"/>
      <circle cx="712" cy="352" r="6"/><circle cx="712" cy="384" r="6"/><circle cx="712" cy="416" r="6"/>
    </g>
    <!-- breakers -->
    <g fill="#EDEDEA">
      <rect x="840" y="156" width="8" height="8"/><rect x="840" y="188" width="8" height="8"/>
      <rect x="840" y="220" width="8" height="8"/><rect x="840" y="252" width="8" height="8"/>
      <rect x="840" y="284" width="8" height="8"/><rect x="840" y="316" width="8" height="8"/>
      <rect x="840" y="348" width="8" height="8"/><rect x="840" y="380" width="8" height="8"/>
      <rect x="840" y="412" width="8" height="8"/>
    </g>
    <!-- copper busbar -->
    <rect x="896" y="128" width="32" height="320" fill="#FF5A1F"/>
    <g fill="#0C0D0E">
      <rect x="908" y="156" width="8" height="8"/><rect x="908" y="220" width="8" height="8"/>
      <rect x="908" y="284" width="8" height="8"/><rect x="908" y="348" width="8" height="8"/>
      <rect x="908" y="412" width="8" height="8"/>
    </g>
    <text x="880" y="480" fill="#FF5A1F" font-size="22" font-weight="700" letter-spacing="4">BUS</text>
    <text x="880" y="504" fill="#686B71">Cu  0 OHM</text>
    <!-- output feeder -->
    <path d="M928 288H1168" stroke="#FF5A1F" stroke-width="4"/>
    <rect x="1168" y="278" width="20" height="20" fill="#FF5A1F"/>
    <text x="1104" y="268" fill="#9A9DA3">OUT</text>
    <text x="1144" y="328" fill="#EDEDEA">/v1</text>
    <!-- status LED -->
    <rect x="1168" y="96" width="8" height="8" fill="#00E599"/>
    <text x="1112" y="104" fill="#686B71">PWR</text>
  </g>
</svg>
